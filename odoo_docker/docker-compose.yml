services:
  db:
    image: postgres:15
    container_name: odoo18_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - odoo-net

  odoo:
    image: odoo:18
    container_name: odoo18
    # build: ./build
    depends_on:
      - db
    ports:
      - "8118:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./extra-addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./filestore:/var/lib/odoo
    networks:
      - odoo-net

networks:
  odoo-net: